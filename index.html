<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>WAY Events — Wedding Albums</title>
<meta name="description" content="Premium wedding albums from WAY Events, Bengaluru. Explore layflat, flushmount and keepsake albums, choose your size, cover and finish, and request a quote.">
<meta property="og:title" content="WAY Events — Wedding Albums">
<meta name="theme-color" content="#16233F">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,500;0,6..96,600;1,6..96,400&family=Manrope:wght@400;500;600;700&display=swap">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2064%2064%22%3E%3Crect%20width%3D%2264%22%20height%3D%2264%22%20rx%3D%2212%22%20fill%3D%22%2316233F%22%2F%3E%3Ctext%20x%3D%2232%22%20y%3D%2242%22%20font-family%3D%22Georgia%2Cserif%22%20font-size%3D%2226%22%20fill%3D%22%23E7D7AE%22%20text-anchor%3D%22middle%22%3EW%3C%2Ftext%3E%3C%2Fsvg%3E%0A">
<style id="css-site">/* WAY Events — customer portal styles. Navy and foil-gold, Bodoni Moda display with Manrope text. */
:root{
  --ink:#16233F; --ink-2:#24365C; --ink-soft:#3A4A6B;
  --gold:#B8913A; --gold-2:#8F6F25; --gold-soft:#E7D7AE; --gold-tint:#F6EFDD;
  --paper:#F5F5F2; --white:#FFFFFF; --slate:#566078; --line:#DEE0E6; --line-2:#C7CCD8;
  --ok:#2F6B4F; --ok-tint:#E7F3EC; --danger:#A23B3B; --danger-tint:#FBEDED; --wa:#1F8F55;
  --display:"Bodoni Moda","Didot",Georgia,serif;
  --sans:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r-s:6px; --r-m:10px; --r-l:16px; --wrap:1240px;
  color-scheme:light;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:400 16px/1.6 var(--sans);-webkit-font-smoothing:antialiased;overflow-x:hidden}
img{max-width:100%;display:block}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:4px}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:-999px;top:8px;background:#fff;padding:8px 12px;z-index:100;border-radius:6px}
.skip:focus{left:12px}
main{outline:none;min-height:60vh}
.wrap{max-width:var(--wrap);margin:0 auto;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
.wrap.narrow{max-width:900px}
h1,h2,h3{font-family:var(--display);font-weight:500;letter-spacing:-.01em;line-height:1.12;margin:0;text-wrap:balance}
h1{font-size:clamp(2.1rem,4.4vw,3.6rem)}
h2{font-size:clamp(1.6rem,2.6vw,2.3rem)}
h3,.h3{font-family:var(--display);font-size:1.35rem;font-weight:500;margin:0}
.h4{font-family:var(--sans);font-size:.95rem;font-weight:700;margin:18px 0 6px}
p{margin:0 0 1em;max-width:70ch}
.muted{color:var(--slate)}
.small{font-size:.875rem}
.kicker{font-size:.78rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--gold-2);margin:0 0 8px}
.optional{font-weight:400;color:var(--slate);font-size:.82rem}
.danger{color:var(--danger)!important}
.loading{padding:80px 20px;display:flex;gap:12px;align-items:center;color:var(--slate)}
.spinner{width:18px;height:18px;border-radius:50%;border:2px solid var(--line-2);border-top-color:var(--ink);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.ssr{padding:40px 20px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--ink);background:var(--ink);color:#fff;padding:12px 22px;border-radius:999px;font-weight:600;font-size:.95rem;text-decoration:none;cursor:pointer;line-height:1.2;transition:background .15s,border-color .15s,color .15s;white-space:nowrap}
.btn svg{width:18px;height:18px;flex-shrink:0}
.btn:hover{background:var(--ink-2)}
.btn.ghost{background:transparent;color:var(--ink)}
.btn.ghost:hover{background:#fff}
.btn.ghost-light{background:transparent;color:#fff;border-color:rgba(255,255,255,.5)}
.btn.ghost-light:hover{background:rgba(255,255,255,.1)}
.btn.light{background:#fff;color:var(--ink);border-color:#fff}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#fff}
.btn.gold:hover{background:var(--gold-2);border-color:var(--gold-2)}
.btn.wa{background:var(--wa);border-color:var(--wa);color:#fff}
.btn.wa:hover{background:#18784a}
.btn.small{padding:8px 14px;font-size:.86rem}
.btn.block{width:100%}
.btn[disabled],.btn.disabled{opacity:.45;cursor:not-allowed;pointer-events:none}
.link{background:none;border:0;padding:0;color:var(--ink);text-decoration:underline;text-underline-offset:3px;cursor:pointer;font-weight:600;font-size:.95rem}
.link:hover{color:var(--gold-2)}
.cta{display:flex;gap:12px;flex-wrap:wrap}
.cta.center{justify-content:center}

/* header */
.top{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.97);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:22px;height:70px}
.brand{display:flex;flex-direction:column;text-decoration:none;line-height:1;flex-shrink:0}
.brand b{font-family:var(--display);font-size:1.85rem;font-weight:600;letter-spacing:.1em}
.brand span{font-size:.68rem;color:var(--gold-2);letter-spacing:.16em;text-transform:uppercase;margin-top:4px}
.nav{display:flex;gap:2px;flex:1}
.nav-item{position:relative}
.nl{display:block;padding:10px 12px;border-radius:8px;text-decoration:none;font-weight:600;font-size:.93rem}
.nl:not(.plain)::after{content:"";display:inline-block;width:6px;height:6px;border-right:1.5px solid currentColor;border-bottom:1.5px solid currentColor;transform:rotate(45deg) translateY(-3px);margin-left:8px;opacity:.5}
.nav-item:hover .nl,.nav-item:focus-within .nl{background:var(--paper)}
.mega{position:absolute;left:-10px;top:100%;margin-top:10px;background:#fff;border:1px solid var(--line);border-radius:var(--r-l);box-shadow:0 22px 50px rgba(22,35,63,.14);padding:22px;display:none;gap:24px;z-index:60}
.mega::before{content:"";position:absolute;left:0;right:0;top:-12px;height:12px}
.nav-item:hover .mega,.nav-item:focus-within .mega{display:grid}
.m-albums{grid-template-columns:repeat(4,minmax(170px,1fr));width:min(900px,92vw)}
.m-covers{grid-template-columns:repeat(9,1fr);width:min(900px,92vw);left:-160px;gap:10px}
.m-list{min-width:240px}
.mega a{display:block;padding:4px 0;text-decoration:none;font-size:.9rem}
.mega a:hover{color:var(--gold-2)}
.mega .mh{font-weight:700;margin-bottom:4px}
.mega .mh span,.mega .muted{color:var(--slate);font-weight:500;font-size:.8rem}
.mega .more{color:var(--slate);font-size:.84rem}
.mega .sw{display:flex;flex-direction:column;gap:8px;font-weight:600;font-size:.8rem;text-align:center}
.swt{display:block;aspect-ratio:3/4;border-radius:10px;background-color:var(--c);background-size:120px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.06)}
.pill{font-style:normal;font-size:.64rem;border-radius:999px;padding:1px 7px;margin-left:6px;font-weight:700;background:var(--ok-tint);color:var(--ok);vertical-align:2px}
.icons{display:flex;gap:4px;align-items:center;margin-left:auto}
.ic{position:relative;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;border:0;background:none;cursor:pointer;text-decoration:none;color:var(--ink)}
.ic:hover{background:var(--paper)}
.ic svg{width:20px;height:20px}
.ic .count{position:absolute;top:2px;right:0;background:var(--gold);color:#fff;font-size:.66rem;font-weight:700;min-width:17px;height:17px;border-radius:9px;display:grid;place-items:center;padding:0 4px}
.icons .btn{margin-left:6px}
.burger{display:none}
.drawer{display:none}
@media (max-width:1060px){.nav{display:none}.burger{display:grid}
  .drawer.open{display:block;position:fixed;inset:70px 0 0;background:#fff;z-index:49;overflow:auto;padding:8px max(20px,env(safe-area-inset-left,0px)) 40px}
  .drawer a{display:block;padding:12px 0;border-bottom:1px solid var(--line);text-decoration:none;font-weight:600}
  .drawer h4{margin:22px 0 2px;color:var(--slate);font-size:.74rem;letter-spacing:.08em;text-transform:uppercase}}
@media (max-width:760px){.hide-m{display:none}}
@media (max-width:420px){.hide-s{display:none}.bar{gap:8px}}
.search{display:none;border-top:1px solid var(--line);background:#fff}
.search.open{display:block}
.search input{width:100%;border:0;padding:16px 0;font-size:1.05rem;outline:none;background:transparent}
.qres{display:grid;gap:2px;padding-bottom:12px}
.qres a{display:flex;justify-content:space-between;gap:12px;padding:9px 10px;border-radius:8px;text-decoration:none}
.qres a:hover,.qres a:focus{background:var(--paper)}
.qres a span{color:var(--slate);font-size:.85rem}
.qres .all{font-weight:600;color:var(--gold-2)}
.crumbs{font-size:.85rem;color:var(--slate);padding:18px 0 0}
.crumbs a{text-decoration:none}
.crumbs a:hover{color:var(--ink);text-decoration:underline}
.crumbs span[aria-hidden]{margin:0 4px;opacity:.6}

/* sections */
.sec{padding:72px 0}
.sec.white{background:#fff}
.sec-head{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:26px;flex-wrap:wrap}
.sec-head p{margin:.5em 0 0}
.page-head{padding:20px 0 24px}
.page-head h1{margin-bottom:10px}
.page-head.split{display:grid;grid-template-columns:1.2fr 1fr;gap:40px;align-items:center}
.coll-hero{width:100%;height:210px;border-radius:var(--r-l);display:block}
@media (max-width:800px){.page-head.split{grid-template-columns:1fr}.coll-hero{height:150px}}
.hint{font-size:.84rem;color:var(--slate);margin:10px 0 0}
.illus-note{font-size:.84rem;color:var(--slate);margin:10px 0 0}

/* hero */
.hero{position:relative;background:var(--ink);color:#fff;overflow:hidden}
.hero-bg{position:absolute;inset:0;width:100%;height:100%;opacity:.36}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(22,35,63,.97) 0%,rgba(22,35,63,.84) 46%,rgba(22,35,63,.4) 100%);pointer-events:none}
.hero-in{position:relative;z-index:1;display:grid;grid-template-columns:1fr 1fr;gap:40px;align-items:center;padding-top:60px;padding-bottom:60px}
.hero h1{color:#fff;font-size:clamp(2.3rem,4.6vw,4rem)}
.hero-copy p{color:#CDD3E0;font-size:1.1rem;margin:20px 0 28px;max-width:50ch}
.facts{display:flex;gap:34px;margin:40px 0 0;flex-wrap:wrap}
.facts div{display:flex;flex-direction:column}
.facts dt{font-family:var(--display);font-size:2rem;line-height:1;color:#fff}
.facts dd{margin:6px 0 0;color:#AEB7CB;font-size:.85rem}
.hero-stage{display:flex;flex-direction:column;align-items:center;gap:14px}
.hero-art{width:100%;aspect-ratio:1.45;container-type:size;display:grid;place-items:center}
.hero-pick{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.hero-pick button{border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.05);color:#fff;border-radius:999px;padding:6px 13px;font-size:.82rem;cursor:pointer}
.hero-pick button[aria-pressed=true]{background:#fff;color:var(--ink);border-color:#fff}
.hero-link{color:var(--gold-soft);font-size:.92rem;text-underline-offset:3px}
.hero .illus-note{color:#8F9AB2;margin:0;font-size:.78rem}
@media (max-width:900px){.hero-in{grid-template-columns:1fr;padding-top:30px}.hero-stage{order:-1}.hero::after{background:linear-gradient(180deg,rgba(22,35,63,.6),rgba(22,35,63,.95))}}

/* ranges */
.ranges{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:16px}
.range{display:grid;grid-template-columns:112px 1fr;gap:14px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:var(--r-l);padding:12px;text-decoration:none;transition:border-color .15s}
.range:hover{border-color:var(--ink)}
.range-art{display:grid;place-items:center;aspect-ratio:1.1;container-type:size;background:radial-gradient(ellipse at 50% 35%,#FBFBFC,#E6E9EF);border-radius:var(--r-m)}
.range-body{display:flex;flex-direction:column;gap:4px}
.range-body b{font-family:var(--display);font-weight:500;font-size:1.2rem}
.range-body span{font-size:.88rem;color:var(--slate);line-height:1.45}
.range-body em{font-style:normal;font-size:.8rem;font-weight:600;color:var(--gold-2)}

/* mosaic */
.mosaic{display:grid;grid-template-columns:repeat(12,1fr);grid-auto-rows:clamp(120px,15vw,200px);gap:14px}
.mtile{position:relative;border-radius:var(--r-l);overflow:hidden;display:block;background:#ddd;isolation:isolate}
.mtile canvas{width:100%;height:100%;display:block;transition:transform .5s ease}
.mtile:hover canvas{transform:scale(1.04)}
.mlabel{position:absolute;left:12px;bottom:12px;background:rgba(255,255,255,.94);color:var(--ink);font-weight:700;font-size:.86rem;border-radius:999px;padding:6px 8px 6px 14px;display:inline-flex;align-items:center;gap:4px}
.mlabel i{display:grid;place-items:center;width:18px;height:18px}.mlabel svg{width:14px;height:14px}
.m1{grid-column:1/5}.m2{grid-column:5/7}.m3{grid-column:7/9;grid-row:span 2}.m4{grid-column:9/13}.m5{grid-column:1/3}.m6{grid-column:3/7}.m7{grid-column:9/13}.m8{grid-column:1/7}.m9{grid-column:7/13}
@media (max-width:760px){.mosaic{grid-template-columns:1fr 1fr;grid-auto-rows:140px}.mtile{grid-column:auto!important;grid-row:auto!important}.m1,.m8,.m9{grid-column:1/-1!important}}

/* cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:20px}
.card{background:#fff;border:1px solid var(--line);border-radius:var(--r-l);display:flex;flex-direction:column;overflow:hidden;transition:border-color .15s,box-shadow .15s}
.card:hover{border-color:var(--line-2);box-shadow:0 14px 30px -18px rgba(22,35,63,.35)}
.shot{position:relative;display:grid;place-items:center;aspect-ratio:1.18;container-type:size;background:radial-gradient(ellipse at 50% 35%,#FBFBFC 0%,#E7EAF0 75%)}
.shot img{width:100%;height:100%;object-fit:cover}
.badge{position:absolute;top:12px;left:12px;z-index:2;font-size:.68rem;font-weight:700;letter-spacing:.05em;padding:4px 10px;border-radius:999px;background:var(--ink);color:#fff;text-transform:uppercase}
.badge.new{background:var(--ok)}
.badge.inline{position:static;display:inline-block;margin:0 0 10px}
.illus{position:absolute;right:10px;bottom:10px;font-size:.66rem;font-weight:600;color:var(--slate);background:rgba(255,255,255,.85);border-radius:999px;padding:2px 8px;z-index:3}
.card .body{padding:14px 16px 16px;display:flex;flex-direction:column;gap:4px;flex:1}
.lineName{font-size:.72rem;letter-spacing:.07em;text-transform:uppercase;font-weight:700;color:var(--gold-2)}
.pname{font-family:var(--display);font-size:1.3rem;font-weight:500;line-height:1.2;margin:0}
.pname a{text-decoration:none}
.pname a::after{content:"";position:absolute;inset:0}
.card{position:relative}
.hl{font-size:.9rem;margin:2px 0 0;color:var(--ink-soft)}
.meta{font-size:.82rem;color:var(--slate);margin:0}
.cardfoot{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:auto;padding-top:10px}
.price{font-size:.9rem}
.price b{font-size:1.02rem}
.cmp{position:relative;z-index:2;display:inline-flex;gap:6px;align-items:center;border:1px solid var(--line-2);background:#fff;border-radius:999px;padding:4px 10px 4px 6px;font-size:.78rem;font-weight:600;cursor:pointer}
.cmp svg{width:14px;height:14px;opacity:0}
.cmp[aria-pressed=true]{background:var(--ink);color:#fff;border-color:var(--ink)}
.cmp[aria-pressed=true] svg{opacity:1}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:.78rem;border:1px solid var(--line);border-radius:999px;padding:3px 10px;color:var(--slate);background:#fff;text-decoration:none}
a.chip:hover{border-color:var(--ink);color:var(--ink)}
.rail{display:grid;grid-auto-flow:column;grid-auto-columns:clamp(230px,24vw,270px);gap:18px;overflow-x:auto;padding-bottom:10px;scroll-snap-type:x proximity}
.rail>*{scroll-snap-align:start}

/* guide + story */
.tbl-scroll{overflow-x:auto;background:#fff;border:1px solid var(--line);border-radius:var(--r-l)}
table.guide{width:100%;border-collapse:collapse;font-size:.92rem}
.guide th,.guide td{padding:14px 16px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.guide thead th{font-size:.76rem;letter-spacing:.06em;text-transform:uppercase;color:var(--slate);background:#FAFAF8}
.guide tbody th a{font-weight:700;text-decoration:none}
.guide tr:last-child>*{border-bottom:0}
.story{background:var(--ink);color:#fff}
.story-in{display:grid;grid-template-columns:1.05fr 1fr;gap:56px;align-items:center}
.story-art{aspect-ratio:1.7;container-type:size;display:grid;place-items:center}
.steps{list-style:none;padding:0;margin:20px 0 26px;display:grid;gap:16px;counter-reset:s}
.steps li{counter-increment:s;display:grid;grid-template-columns:36px 1fr;column-gap:14px}
.steps li::before{content:counter(s);grid-row:span 2;width:32px;height:32px;border-radius:50%;border:1px solid var(--gold-soft);color:var(--gold-soft);display:grid;place-items:center;font-family:var(--display);font-size:1.05rem}
.steps span{color:#C6CDDB;font-size:.93rem}
.small-steps{margin-top:34px}
.small-steps li::before{border-color:var(--gold);color:var(--gold-2)}
.small-steps span{color:var(--slate)}
@media (max-width:900px){.story-in{grid-template-columns:1fr;gap:30px}}
.reviews{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(300px,1fr);overflow-x:auto;border:1px solid var(--line);border-radius:var(--r-l);background:#fff}
.review{margin:0;padding:28px 30px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:14px}
.stars{display:flex;gap:4px;color:#D29A1E}.stars svg{width:18px;height:18px}
.review blockquote{margin:0;font-style:italic;line-height:1.6;flex:1}
.review figcaption{display:flex;gap:12px;align-items:center}
.av{width:42px;height:42px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;font-weight:700}
.review small{display:block;color:var(--slate)}
.reels{display:grid;grid-auto-flow:column;grid-auto-columns:clamp(200px,22vw,250px);gap:16px;overflow-x:auto}
.reel{position:relative;aspect-ratio:9/16;border-radius:var(--r-l);overflow:hidden;text-decoration:none;color:#fff;background:#222}
.reel img{width:100%;height:100%;object-fit:cover}
.reel-bg{position:absolute;inset:0;background:linear-gradient(160deg,#3A2A5A,#8A3A5A)}
.reel b{position:absolute;left:0;right:0;bottom:0;padding:30px 12px 12px;background:linear-gradient(transparent,rgba(0,0,0,.7));font-size:.9rem}
.cta-band{background:var(--gold-tint);text-align:center}
.cta-band p{margin:12px auto 22px;color:var(--ink-soft)}

/* catalog */
.toolbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;border-bottom:1px solid var(--line);padding:12px 0;margin-bottom:18px;position:sticky;top:70px;background:var(--paper);z-index:5}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{border:1px solid var(--line-2);background:#fff;border-radius:999px;padding:6px 14px;font-weight:600;font-size:.85rem;cursor:pointer}
.seg button[aria-pressed=true]{background:var(--ink);color:#fff;border-color:var(--ink)}
.toolbar .right{margin-left:auto;display:flex;gap:10px;align-items:center;font-size:.9rem;color:var(--slate)}
input[type=text],input[type=search],input[type=tel],input[type=email],input[type=number],input[type=date],input[type=password],input[type=url],select,textarea{border:1px solid var(--line-2);background:#fff;border-radius:var(--r-s);padding:10px 12px;width:100%;min-width:0;font-size:1rem}
select{width:auto;padding-right:30px}
.form select{width:100%}
textarea{min-height:96px;resize:vertical}
[aria-invalid=true]{border-color:var(--danger)!important;box-shadow:0 0 0 1px var(--danger)}
.active-f{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px}
.active-f button{border:0;background:var(--gold-soft);color:#5B4410;border-radius:999px;padding:5px 12px;font-size:.82rem;font-weight:600;cursor:pointer}
.active-f .clear{background:none;text-decoration:underline}

.toast.show{transform:translateX(-50%) translateY(0)}

/* Album, spread and décor illustrations (CSS-drawn; not photographs) */
/* ================================================================
   Album drawing
   ================================================================ */
.album{--ar:1.5;position:relative;display:block;aspect-ratio:var(--ar);width:min(76cqw,calc(76cqh * var(--ar)));perspective:1300px}

.album.detail{width:min(80cqw,calc(80cqh * var(--ar)))}

.pages{position:absolute;inset:2.5% -2.6% -2.5% 1.5%;border-radius:2px 5px 5px 2px;background:repeating-linear-gradient(90deg,#FBFAF6 0 2px,#E6E2D9 2px 3px),#FBFAF6;box-shadow:0 28px 34px -16px rgba(22,35,63,.5),0 8px 14px -8px rgba(22,35,63,.35)}
.book.thick .pages{inset:3% -4.5% -4% 1.5%;background:repeating-linear-gradient(90deg,#F7F5EF 0 3px,#3a3a3a 3px 4px),#F7F5EF}
.pages::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3.5%;background:repeating-linear-gradient(0deg,#FBFAF6 0 2px,#E1DDD3 2px 3px)}
.album.flat .pages{inset:1.2% -1.4% -1.6% .8%}
.cover{position:absolute;inset:0;border-radius:2px 6px 6px 2px;background-color:var(--c);background-size:150px;overflow:hidden;display:grid;place-items:center;container-type:inline-size;
  box-shadow:inset 7px 0 0 rgba(0,0,0,.18),inset 10px 0 0 rgba(255,255,255,.06),inset 0 0 0 1px rgba(0,0,0,.18)}
.cover::after{content:"";position:absolute;inset:0;background:linear-gradient(118deg,rgba(255,255,255,.2),rgba(255,255,255,0) 38%,rgba(0,0,0,.2));pointer-events:none;z-index:9}
.cover>*{position:absolute}
.cv-title{position:relative!important;z-index:6;font-family:var(--display);color:var(--gold-soft);font-size:clamp(.5rem,7.4cqw,2rem);letter-spacing:.06em;text-align:center;line-height:1.15;padding:0 8%;text-shadow:0 1px 1px rgba(0,0,0,.25)}

.cv-title.foil{background:linear-gradient(100deg,#C29A44,#F6E3A7 45%,#B48A2F 62%,#EED38F);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:none}
.light .cv-title{color:#4A3A22;text-shadow:0 1px 0 rgba(255,255,255,.35)}
.light .cv-title.foil{background:linear-gradient(100deg,#7E5A16,#C9A04A 45%,#6E4C10 62%,#B48A2F);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:none}
.cv-title.burn{color:rgba(60,32,14,.78);text-shadow:0 1px 0 rgba(255,255,255,.25)}
.cv-title.silver{color:#fff;text-shadow:0 0 8px rgba(255,255,255,.5)}
.t-foil .cv-title,.t-foil .cv-title.foil{font-style:italic}
.has-win .cv-title,.has-win .cv-plate{justify-self:start;left:7%;width:48%;text-align:center}
.has-win .cv-title{position:absolute!important;top:50%;transform:translateY(-50%);padding:0}
/* photo windows */
.cv-win{right:8%;top:50%;transform:translateY(-50%);width:34%;aspect-ratio:4/5;overflow:hidden;border:2.5px solid rgba(231,215,174,.9);box-shadow:0 4px 10px rgba(0,0,0,.35);z-index:4}
.w-arch{border-radius:50% 50% 3px 3px/30% 30% 3px 3px}

.w-hex{clip-path:polygon(25% 3%,75% 3%,98% 50%,75% 97%,25% 97%,2% 50%);border:0;width:36%;aspect-ratio:1.1}

.cv-full{inset:0}
.cv-pad{inset:0 0 0 30%}
.cv-two{inset:0 70% 0 0;background:rgba(0,0,0,.28);border-right:1.5px solid rgba(231,215,174,.7);z-index:3}
.cv-full .mag{position:absolute;left:0;right:0;top:6%;text-align:center;font-family:var(--display);color:#fff;font-size:clamp(.6rem,11cqw,2.4rem);letter-spacing:.06em;font-weight:600;z-index:3;text-shadow:0 2px 8px rgba(0,0,0,.35)}
.cv-gloss{inset:0;background:linear-gradient(125deg,rgba(255,255,255,.4) 0%,rgba(255,255,255,0) 30%,rgba(255,255,255,0) 70%,rgba(255,255,255,.18) 100%);z-index:8}
.cv-plate{position:relative!important;z-index:6;font-family:var(--display);font-size:clamp(.42rem,4.6cqw,1.15rem);letter-spacing:.1em;padding:.6em 1.3em;border-radius:3px;box-shadow:0 2px 6px rgba(0,0,0,.4),inset 0 0 0 1px rgba(255,255,255,.35);color:#3A2B10;white-space:nowrap}
.cv-plate.gold{background:linear-gradient(135deg,#B8913A,#F2DC9B 45%,#A27A2B 60%,#E5C77B)}
.cv-plate.silver{background:linear-gradient(135deg,#BFC2C7,#F4F5F7 45%,#9EA2A8 60%,#E3E5E8);color:#2B2E33}
.has-win .cv-plate{position:absolute!important;top:50%;transform:translateY(-50%);width:auto;left:9%}
/* crystals */
.cv-cr{inset:0;z-index:5;pointer-events:none;background-repeat:repeat}
.cr2{background-image:radial-gradient(circle,#fff 0 1.2px,rgba(255,255,255,.6) 1.6px,transparent 2.4px),radial-gradient(circle,#fff 0 1px,transparent 1.8px);background-size:22px 22px,30px 30px;background-position:4px 6px,15px 2px;-webkit-mask:radial-gradient(ellipse 40% 55% at 70% 50%,transparent 60%,#000 62%,#000 80%,transparent 82%);mask:radial-gradient(ellipse 40% 55% at 70% 50%,transparent 60%,#000 62%,#000 80%,transparent 82%)}
.cr3{background-image:radial-gradient(circle,#fff 0 1.3px,rgba(255,255,255,.5) 1.7px,transparent 2.6px);background-size:12px 12px;-webkit-mask:linear-gradient(#000,#000) top/100% 14% no-repeat,linear-gradient(#000,#000) bottom/100% 14% no-repeat,linear-gradient(#000,#000) left/10% 100% no-repeat,linear-gradient(#000,#000) right/10% 100% no-repeat;mask:linear-gradient(#000,#000) top/100% 14% no-repeat,linear-gradient(#000,#000) bottom/100% 14% no-repeat,linear-gradient(#000,#000) left/10% 100% no-repeat,linear-gradient(#000,#000) right/10% 100% no-repeat}
.cr4{background-image:radial-gradient(circle,#fff 0 1.2px,rgba(255,255,255,.55) 1.6px,transparent 2.4px),radial-gradient(circle,rgba(255,255,255,.9) 0 .9px,transparent 1.6px);background-size:9px 9px,13px 13px;background-position:0 0,5px 4px}
/* patterns */
.cv-pat{inset:0;z-index:2;pointer-events:none;opacity:.55}
.pat-paisley{background:radial-gradient(circle at 30% 30%,rgba(255,255,255,.35) 0 3px,transparent 4px) 0 0/22px 22px,radial-gradient(ellipse at 70% 60%,transparent 5px,rgba(255,255,255,.25) 6px 7px,transparent 8px) 0 0/22px 22px;-webkit-mask:linear-gradient(90deg,#000 0 28%,transparent 28%);mask:linear-gradient(90deg,#000 0 28%,transparent 28%)}
.pat-brocade{background:repeating-conic-gradient(from 45deg,rgba(231,215,174,.45) 0 25%,transparent 0 50%) 0 0/14px 14px;inset:12% 22%;border:2px solid var(--gold);opacity:.8}
.pat-arto{background:repeating-linear-gradient(115deg,rgba(255,255,255,.25) 0 1px,transparent 1px 12px),repeating-linear-gradient(25deg,rgba(184,145,58,.35) 0 1px,transparent 1px 18px)}
.pat-stripes{background:linear-gradient(90deg,#d24a3a 0 10%,#e8a33a 10% 20%,#e8d54a 20% 30%,#5aa66a 30% 40%,#3a7ac2 40% 50%,transparent 50%);opacity:.75;inset:0 auto 0 0;width:40%}
.cv-etch{inset:7%;border:1px solid rgba(0,0,0,.25);box-shadow:inset 0 0 0 4px rgba(255,255,255,.07),inset 0 0 0 5px rgba(0,0,0,.2);border-radius:4px;z-index:2}
.cv-floral{inset:auto -5% -10% auto;width:55%;aspect-ratio:1;background:radial-gradient(circle at 40% 40%,rgba(255,255,255,.55) 0 8%,transparent 9%),radial-gradient(circle at 60% 55%,rgba(255,220,225,.6) 0 10%,transparent 11%),radial-gradient(circle at 30% 65%,rgba(255,255,255,.4) 0 7%,transparent 8%),radial-gradient(circle at 70% 30%,rgba(255,235,240,.5) 0 6%,transparent 7%);z-index:2}
.cv-wrap{inset:0 auto 0 58%;width:14%;background:rgba(0,0,0,.35);box-shadow:inset 1px 0 0 rgba(255,255,255,.2),inset -1px 0 0 rgba(255,255,255,.2);z-index:6}
.cv-baby{left:50%;top:22%;transform:translateX(-50%);width:16%;aspect-ratio:.55;background:rgba(255,255,255,.85);border-radius:40% 40% 18% 18%;box-shadow:0 -8% 0 -3% rgba(255,255,255,.85);z-index:3}

.cv-frame{right:5.5%;top:50%;transform:translateY(-50%);width:39%;aspect-ratio:4/5.1;border:1.5px solid var(--gold);outline:1px solid var(--gold);outline-offset:4px;z-index:5}
.cv-emboss{left:50%;top:50%;transform:translate(-50%,-62%);width:34%;aspect-ratio:1;border-radius:50%;background:repeating-radial-gradient(circle,rgba(255,255,255,.18) 0 2px,rgba(0,0,0,.1) 2px 4px,transparent 4px 9px);box-shadow:inset 0 2px 3px rgba(255,255,255,.3),inset 0 -2px 3px rgba(0,0,0,.25);z-index:2}

.cv-multi{right:6%;top:50%;transform:translateY(-50%);width:42%;height:70%;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:4%;z-index:4}

.cv-multi.d3 .ph:nth-child(2){transform:translate(-6%,-6%)}.cv-multi.d3 .ph:nth-child(3){transform:translate(6%,6%)}
.cv-layer{right:7%;top:50%;transform:translateY(-50%);width:40%;aspect-ratio:4/5;z-index:4}
.cv-layer s{position:absolute;inset:0;border-radius:4px;box-shadow:inset 0 0 0 999px var(--c),0 2px 6px rgba(0,0,0,.35)}

.ph i::before,.ph i::after{content:"";position:absolute;bottom:0;width:50%;height:100%;background:radial-gradient(circle at 50% 17%,var(--s,#2a1a22) 0 13%,transparent 14%),radial-gradient(ellipse 48% 70% at 50% 100%,var(--s,#2a1a22) 0 98%,transparent 100%)}

<template id="css-admin">/* WAY Events — studio admin. A quiet, dense working interface. */
:root{--ink:#16233F;--ink-2:#24365C;--gold:#B8913A;--gold-tint:#F6EFDD;--paper:#F4F5F7;--white:#fff;--slate:#5A6378;--line:#DDE0E7;--line-2:#C7CCD8;--ok:#2F6B4F;--ok-tint:#E6F2EB;--warn:#8A5A00;--warn-tint:#FFF5DB;--danger:#A23B3B;--danger-tint:#FBECEC;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--r:8px;color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:400 14px/1.5 var(--sans)}
a{color:inherit}button,input,select,textarea{font:inherit;color:inherit}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.boot{padding:40px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.shell{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
.side{background:var(--ink);color:#C9CFDC;padding:18px 12px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:2px}
.side .logo{font-family:Georgia,serif;font-size:1.5rem;color:#fff;letter-spacing:.08em;padding:4px 10px 16px}
.side .logo small{display:block;font-family:var(--sans);font-size:.7rem;letter-spacing:.12em;color:#E7D7AE;text-transform:uppercase}
.side a{display:flex;justify-content:space-between;padding:8px 10px;border-radius:6px;text-decoration:none;font-weight:600}
.side a:hover{background:rgba(255,255,255,.07)}
.side a[aria-current=page]{background:rgba(255,255,255,.14);color:#fff}
.side .n{background:var(--gold);color:#fff;border-radius:999px;font-size:.72rem;padding:0 7px}
.side .bottom{margin-top:auto;border-top:1px solid rgba(255,255,255,.12);padding-top:10px}
.main{padding:22px 28px 60px;min-width:0}
@media (max-width:860px){.shell{grid-template-columns:1fr}.side{position:static;height:auto;flex-direction:row;flex-wrap:wrap}.side .bottom{margin:0;border:0;padding:0}}
h1{font-size:1.6rem;margin:0 0 4px}h2{font-size:1.15rem;margin:0 0 10px}h3{font-size:1rem;margin:16px 0 8px}
.muted{color:var(--slate)}.small{font-size:.86rem}
.head{display:flex;justify-content:space-between;align-items:end;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--ink);background:var(--ink);color:#fff;padding:7px 14px;border-radius:6px;font-weight:600;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn:hover{background:var(--ink-2)}.btn.ghost{background:#fff;color:var(--ink);border-color:var(--line-2)}.btn.ghost:hover{border-color:var(--ink)}
.btn.danger{background:#fff;color:var(--danger);border-color:#E3B9B9}.btn.small{padding:4px 10px;font-size:.85rem}.btn:disabled{opacity:.5;cursor:not-allowed}
.link{background:none;border:0;padding:0;color:var(--ink);text-decoration:underline;cursor:pointer;font-weight:600}
.card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:18px;margin-bottom:16px;min-width:0}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.kpi b{display:block;font-size:1.7rem;font-variant-numeric:tabular-nums}.kpi span{color:var(--slate);font-size:.85rem}
.kpi.warn{border-left:4px solid var(--gold)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}@media (max-width:1000px){.grid2{grid-template-columns:1fr}}
.tblw{overflow:auto;background:#fff;border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{background:#F8F9FB;font-size:.78rem;color:var(--slate);font-weight:700;white-space:nowrap}
.tblw th{position:sticky;top:0;z-index:1}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
tbody tr.click{cursor:pointer}tbody tr.click:hover{background:#FAFBFD}
.pill{display:inline-block;border-radius:999px;padding:1px 9px;font-size:.76rem;font-weight:700;background:#ECEFF4;color:var(--slate);white-space:nowrap}
.pill.published,.pill.ok,.pill.delivered,.pill.confirmed{background:var(--ok-tint);color:var(--ok)}
.pill.draft,.pill.warn,.pill.quote_pending,.pill.awaiting_approval,.pill.submitted{background:var(--warn-tint);color:var(--warn)}
.pill.archived,.pill.cancelled,.pill.issue{background:var(--danger-tint);color:var(--danger)}
.pill.enquiry_received{background:#E8EEFB;color:#2A4A8A}
.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
input:not([type]),input[type=text],input[type=search],input[type=number],input[type=email],input[type=tel],input[type=date],input[type=password],input[type=url],select,textarea{border:1px solid var(--line-2);border-radius:6px;padding:7px 9px;background:#fff;width:100%;min-width:0}
textarea{min-height:80px;resize:vertical}
.bar input[type=search]{max-width:280px}.bar select{width:auto}
.f{display:grid;grid-template-columns:repeat(2,1fr);gap:12px 16px}.f.three{grid-template-columns:repeat(3,1fr)}
.f label{display:flex;flex-direction:column;gap:4px;font-weight:600;font-size:.86rem}
.f label.inline,label.inline{flex-direction:row;align-items:center;gap:8px;font-weight:500}
.f .full{grid-column:1/-1}
.f label em,.hint{font-style:normal;font-weight:400;color:var(--slate);font-size:.8rem}
@media (max-width:700px){.f,.f.three{grid-template-columns:1fr}}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:14px;flex-wrap:wrap}
.tabs button{border:0;background:none;padding:9px 12px;font-weight:600;color:var(--slate);border-bottom:2px solid transparent;margin-bottom:-1px;cursor:pointer}
.tabs button[aria-selected=true]{color:var(--ink);border-color:var(--ink)}
.notice{background:var(--warn-tint);border:1px solid #EFD9A0;border-radius:8px;padding:10px 12px;margin-bottom:12px}
.notice.private{background:#F1ECFA;border-color:#D7CBEF}
.notice.ok{background:var(--ok-tint);border-color:#BFDCCB}
.err{color:var(--danger);font-weight:600;font-size:.85rem}
.rows .row{display:grid;gap:8px;align-items:start;padding:6px 0;border-bottom:1px dashed var(--line)}
.opt{border:1px solid var(--line);border-radius:8px;padding:12px;margin-bottom:10px;background:#FCFCFD}
.opt-h{display:flex;gap:8px;align-items:center;justify-content:space-between;margin-bottom:8px}
.vals th,.vals td{padding:4px 6px}
.sizepick{display:flex;flex-wrap:wrap;gap:6px}
.sizepick label{border:1px solid var(--line-2);border-radius:6px;padding:3px 8px;font-weight:500;flex-direction:row;gap:6px}
.imgs{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
.img{border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#fff}
.img img{width:100%;aspect-ratio:1.2;object-fit:cover;display:block;background:#EEF0F4}
.img div{padding:8px;display:grid;gap:6px}
.sheet{white-space:pre-wrap;font-family:ui-monospace,Menlo,monospace;font-size:.84rem;background:#F8F9FB;border:1px solid var(--line);border-radius:8px;padding:12px;max-height:340px;overflow:auto}
.hist{list-style:none;padding:0;margin:0}.hist li{border-left:2px solid var(--line);padding:2px 0 10px 12px}
.verify li{margin:4px 0}
.login{min-height:100vh;display:grid;place-items:center;padding:20px}
.login form{background:#fff;border:1px solid var(--line);border-radius:12px;padding:28px;width:min(380px,100%);display:grid;gap:12px}
.login h1{font-family:Georgia,serif;letter-spacing:.06em}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%) translateY(120px);background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;font-weight:600;z-index:99;transition:transform .2s}
.toast:not(.show){visibility:hidden}.toast.show{transform:translateX(-50%) translateY(0)}
.sticky-save{position:sticky;bottom:0;background:rgba(244,245,247,.95);padding:10px 0;display:flex;gap:10px;align-items:center;border-top:1px solid var(--line);margin-top:12px;z-index:5}

.demo-bar{background:#B8913A;color:#16233F;font:600 13px/1.4 system-ui;padding:7px 16px;display:flex;gap:12px;justify-content:center;flex-wrap:wrap}.demo-bar a,.demo-bar button{color:#16233F;font:inherit;text-decoration:underline;background:none;border:0;padding:0;cursor:pointer}</template>
</head>

    const move = (e) => { if (!zoomed) return; const r = st.getBoundingClientRect(); st.style.setProperty("--ox", ((e.clientX - r.left) / r.width) * 100 + "%"); st.style.setProperty("--oy", ((e.clientY - r.top) / r.height) * 100 + "%"); };

    const close = () => { lb.hidden = true; lb.innerHTML = ""; document.removeEventListener("keydown", onKey); $("#zoomBtn") && $("#zoomBtn").focus(); };

  }
  function trackView(o) {
    const flow = (CAT.settings.statuses || L.STATUSES).filter((s) => s.id !== "cancelled");
    const idx = flow.findIndex((s) => s.id === o.status);
    return `<article class="panel order"><div class="ohead"><div><h2 class="h3">${esc(o.ref)}</h2><span class="muted small">${o.kind === "order" ? "Order request" : "Quote request"} · ${new Date(o.createdAt).toLocaleDateString("en-IN", { day: "numeric", month: "short", year: "numeric" })}</span></div><span class="stage-pill ${o.status === "cancelled" ? "bad" : ""}">${esc(o.statusLabel)}</span></div>
      ${o.status === "cancelled" ? `<p class="ferr">This order was cancelled. Contact us if that's unexpected.</p>` : `<ol class="timeline">${flow.map((s, i) => `<li class="${i < idx ? "done" : i === idx ? "now" : ""}">${esc(s.label)}</li>`).join("")}</ol>`}
      ${o.quotation ? `<div class="quote-box"><h3>Your quotation</h3><dl class="sum-list"><div><dt>Amount</dt><dd>${inr(o.quotation.amount)}</dd></div>${o.quotation.tax ? `<div><dt>${esc(CAT.settings.taxLabel || "Tax")}</dt><dd>${inr(o.quotation.tax)}</dd></div>` : ""}<div><dt><b>Total</b></dt><dd><b>${inr(o.quotation.total)}</b></dd></div>${o.quotation.validUntil ? `<div><dt>Valid until</dt><dd>${esc(o.quotation.validUntil)}</dd></div>` : ""}</dl>${o.quotation.message ? `<p>${esc(o.quotation.message)}</p>` : ""}<a class="btn wa small" target="_blank" rel="noopener" href="${waLink(`Hi WAY, I'd like to go ahead with ${o.ref}.`)}">${I.wa} Approve on WhatsApp</a></div>` : ""}
      <h3 class="h4">Items</h3><ul class="co-items">${o.items.map((i) => `<li><b>${i.quantity} × ${esc(i.productName)}</b><span>${esc((i.summary || []).map((s) => s.value).join(" · "))}</span></li>`).join("")}</ul>
      <h3 class="h4">Updates</h3><ul class="history">${o.history.slice().reverse().map((h) => `<li><b>${esc(h.label)}</b><span>${new Date(h.at).toLocaleString("en-IN", { day: "numeric", month: "short", hour: "numeric", minute: "2-digit" })}</span>${h.note ? `<p>${esc(h.note)}</p>` : ""}</li>`).join("")}</ul></article>`;
  }

  /* ================================================================ quote request & static pages */
  function vQuote(m, q) {
    const me = store.get("way.me.v1", {});
    return { title: "Request a quote", html: `<div class="wrap">${crumbs(["Request a quote"])}<header class="page-head"><h1>Request a quote</h1><p class="muted">Tell us what you have in mind and we'll suggest albums and send prices. Already chosen? <a href="/albums">Configure an album</a> and add it to your order list instead.</p></header>
      <div class="two"><form class="panel form" id="qf" novalidate>
        <label class="req" for="qf-name">Full name<input id="qf-name" name="name" autocomplete="name" value="${esc(me.name || "")}"><span class="ferr" data-err="customer.name"></span></label>
        <label class="req" for="qf-phone">Mobile number<input id="qf-phone" name="phone" type="tel" inputmode="tel" autocomplete="tel" value="${esc(me.phone || "")}"><span class="ferr" data-err="customer.phone"></span></label>
        <label for="qf-email">Email <span class="optional">optional</span><input id="qf-email" name="email" type="email" autocomplete="email" value="${esc(me.email || "")}"><span class="ferr" data-err="customer.email"></span></label>
        <label class="req" for="qf-city">City<input id="qf-city" name="city" value="${esc(me.city || "")}"><span class="ferr" data-err="delivery.city"></span></label>
        <label for="qf-range">Range you're considering<select id="qf-range" name="range"><option value="">Not sure yet</option>${CAT.categories.map((c) => `<option ${q.range === c.id ? "selected" : ""}>${esc(c.name)}</option>`).join("")}</select></label>
        <label for="qf-date">Event date <span class="optional">optional</span><input id="qf-date" name="date" type="date"></label>
        <label class="full req" for="qf-notes">What are you looking for?<textarea id="qf-notes" name="notes" maxlength="1500" placeholder="e.g. a 12×18 album for our wedding with around 80 pages, plus two smaller copies for our parents">${esc(q.product ? `I'm interested in ${q.product}. ` : "")}</textarea><span class="ferr" data-err="notes"></span></label>
        <label class="inline full"><input type="checkbox" name="consent"> I agree to the <a href="/terms" target="_blank">terms</a> and <a href="/privacy" target="_blank">privacy notice</a>.</label><span class="ferr full" data-err="consent"></span>
        <div class="full"><button class="btn gold" type="submit">Send quote request</button></div><p class="ferr full" id="qErr" role="alert"></p></form>
        <aside class="panel"><h2 class="h3">Prefer to talk?</h2><p>WhatsApp or call <b>${esc(CAT.settings.phone)}</b>, ${esc(CAT.settings.hours)}.</p><a class="btn wa" target="_blank" rel="noopener" href="${waLink("Hi WAY, I'd like a quote for an album.")}">${I.wa} WhatsApp us</a></aside></div><p style="padding-bottom:70px"></p></div>`,
      after() {
        const f = $("#qf");
        f.onsubmit = async (e) => {
          e.preventDefault(); $$(".ferr", f).forEach((x) => (x.textContent = "")); const d = Object.fromEntries(new FormData(f));
          const notes = [d.range ? `Range: ${d.range}` : "", d.date ? `Event date: ${d.date}` : "", d.notes].filter(Boolean).join("\n");
          try {
            const r = await api("/api/orders", { method: "POST", body: { general: true, items: [], customer: { name: d.name, phone: d.phone, email: d.email }, delivery: { city: d.city }, notes: d.notes.trim() ? notes : "", consent: !!d.consent } });
            store.set("way.me.v1", Object.assign(store.get("way.me.v1", {}), { name: d.name, phone: d.phone, email: d.email, city: d.city }));
            try { sessionStorage.setItem("way.lastOrder", JSON.stringify(r.order)); } catch (er) {}
            go("/order/confirmation/" + r.ref);
          } catch (er) { if (er.details) for (const [k, msg] of Object.entries(er.details)) { const s = $(`[data-err="${k}"]`, f); if (s) s.textContent = msg; else $("#qErr").textContent += msg + " "; } else $("#qErr").textContent = er.message; }
        };
      } };
  }
  const page = (title, body) => ({ title, html: `<div class="wrap narrow">${crumbs([title])}<header class="page-head"><h1>${esc(title)}</h1></header><div class="prose">${body}</div><p style="padding-bottom:70px"></p></div>` });
  const para = (t) => String(t || "").split(/\n{2,}/).map((x) => `<p>${esc(x)}</p>`).join("");
  function vAbout() { const s = CAT.settings; return page("About WAY", `${para(s.aboutText)}<p>Every album on this site can be configured online and sent to us as an order or quote request. We confirm details and price with you before anything is produced.</p><p><a class="btn" href="/albums">Explore albums</a></p>`); }
  function vContact() { const s = CAT.settings; return page("Contact us", `<div class="contact-cards"><a class="ccard" target="_blank" rel="noopener" href="${waLink("Hi WAY")}"><span class="cic wa">${I.wa}</span><b>WhatsApp</b><span>${esc(s.phone)}</span><em>Quickest — share photos directly</em></a><div class="ccard"><b>Phone</b><span>${esc(s.phone)}</span><em>${esc(s.hours)}</em></div>${s.email ? `<a class="ccard" href="mailto:${esc(s.email)}"><b>Email</b><span>${esc(s.email)}</span></a>` : ""}<div class="ccard"><b>Studio</b><span>${esc(s.address)}</span></div></div><p>For prices, use <a href="/quote">Request a quote</a> or add albums to your <a href="/order">order list</a>. To check an order, <a href="/track">track it here</a>.</p>`); }
  function vFaq() { return page("Questions & answers", `<div class="faq">${(CAT.settings.faqs || []).map((f, i) => `<details ${i === 0 ? "open" : ""}><summary>${esc(f.q)}</summary><p>${esc(f.a)}</p></details>`).join("")}</div><p>Still have a question? <a href="/contact">Contact us</a>.</p>`); }
  function vDelivery() { const lt = CAT.settings.leadTimes || {}; const rows = Object.entries(lt).filter(([, v]) => v); return page("Delivery & production", `${para(CAT.settings.policies.delivery)}${rows.length ? `<table class="guide"><tbody>${rows.map(([k, v]) => `<tr><th scope="row">${esc((CATS[k] || {}).name || k)}</th><td>${esc(v)}</td></tr>`).join("")}</tbody></table>` : ""}`); }
  function vCare() { return page("Album care", `<ul class="plain-list">${CARE.map((c) => `<li>${esc(c)}</li>`).join("")}</ul>`); }
  function vPrivacy() { return page("Privacy", para(CAT.settings.policies.privacy)); }
  function vTerms() { return page("Terms", para(CAT.settings.policies.terms)); }

  /* ================================================================ routes & boot */
  route(/^\/$/, vHome);
  route(/^\/albums$/, (m, q) => vCatalog({}, q));
  route(/^\/albums\/([a-z0-9-]+)$/, vProduct);
  route(/^\/category\/([a-z0-9-]+)$/, (m, q) => vCatalog({ category: m[1] }, q));
  route(/^\/collections$/, vCollections);
  route(/^\/collections\/([a-z0-9-]+)$/, (m, q) => vCatalog({ collection: m[1] }, q));
  route(/^\/compare$/, vCompare);
  route(/^\/order$/, vOrder);
  route(/^\/checkout$/, vCheckout);
  route(/^\/order\/confirmation\/([A-Z0-9-]+)$/, vConfirm);
  route(/^\/track$/, vTrack);
  route(/^\/quote$/, vQuote);
  route(/^\/about$/, vAbout); route(/^\/contact$/, vContact); route(/^\/faq$/, vFaq); route(/^\/delivery$/, vDelivery); route(/^\/care$/, vCare); route(/^\/privacy$/, vPrivacy); route(/^\/terms$/, vTerms);

  (async function boot() {
    try { await loadCatalog(); }
    catch (e) { $("#main").innerHTML = `<div class="wrap sec"><div class="empty"><h1>The album catalogue didn't load</h1><p class="muted">Check your connection and try again.</p><button class="btn" id="reload">Reload</button></div></div>`; $("#reload").onclick = () => location.reload(); return; }
    COMPARE = COMPARE.filter((id) => CAT.products.some((p) => p.id === id)); store.set("way.compare.v1", COMPARE);
    chrome(); render();
    window.WAYApp = { go, render, cart: () => CART };
  })();
})();
</script>

<script>
(function () {
  window.WAY_DEMO = true;
  window.WAY_SITE = {"email":"weadoreyouway@gmail.com","formEndpoint":"https://formsubmit.co/ajax/weadoreyouway@gmail.com"};
  var run = function (id) { var s = document.createElement("script"); s.textContent = document.getElementById(id).textContent; document.body.appendChild(s); };
  var isAdmin = function () { return !window.WAY_SITE && /^#\/admin(\/|$)/.test(location.hash); };
  var mode = isAdmin() ? "admin" : "site";
  var bar = '<div class="demo-bar" role="note"><span>Demo preview — illustrations only, prices on request, orders stay in this browser.</span>' +
    (mode === "site" ? '<a href="#/admin/dashboard">Open the studio admin (admin / demo-password)</a>' : '<a href="#/">Back to the website</a>') +
    '<button type="button" id="demoReset">Reset demo data</button></div>';
  if (window.WAY_SITE) bar = "";
  if (mode === "admin") { var st = document.getElementById("css-site"); st.textContent = document.getElementById("css-admin").innerHTML; }
  var tpl = document.getElementById(mode === "admin" ? "tpl-admin" : "tpl-site");
  var host = document.createElement("div"); host.innerHTML = bar + tpl.innerHTML;
  while (host.firstChild) document.body.insertBefore(host.firstChild, document.getElementById("way-seed"));
  ["js-schema", "js-logic", "js-api", "js-seed", "js-supplier", "js-host"].forEach(run);
  if (document.getElementById("demoReset")) document.getElementById("demoReset").onclick = function () { window.WAYDemo.reset(); };
  (mode === "admin" ? ["js-admin"] : ["js-tex", "js-render", "js-app"]).forEach(run);
  window.addEventListener("hashchange", function () { if ((isAdmin() ? "admin" : "site") !== mode) location.reload(); });
  document.addEventListener("click", function (e) { var a = e.target.closest && e.target.closest('a[href^="#"][target]'); if (a) a.removeAttribute("target"); }, true);
})();
</script>
</body>
